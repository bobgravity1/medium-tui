[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "medium-tui"
version = "0.4.2"
description = "Search Medium topics and read articles in your terminal"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "defusedxml>=0.7.1,<1",
  "httpx>=0.28,<1",
  "markdownify>=1.2,<2",
  "platformdirs>=4,<5",
  "rich>=13.9,<15",
  "textual>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
medium-reader = "medium_reader.cli:main"
medium-tui = "medium_reader.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/medium_reader"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
